<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenWorld HQ</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Landing page: filled in by src/landing (concept, destinations, GitHub connect) -->
    <section id="title" class="screen"></section>

    <!-- Loading -->
    <section id="loading" class="screen hidden">
      <div class="loading-inner">
        <div class="spinner"></div>
        <div id="loading-text">Building your city…</div>
      </div>
    </section>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-location" class="hud-chip"></div>
      <div id="hud-time" class="hud-chip"></div>
      <div id="hud-agents" class="hud-chip hidden"></div>
      <canvas id="minimap" width="220" height="220"></canvas>
      <div id="prompt" class="prompt hidden"></div>
      <div id="toasts"></div>
      <div id="crosshair"></div>
      <div id="click-to-look" class="hidden">Click the game to look around (or drag)</div>
    </div>

    <div id="fade"></div>
    <div id="panel-root"></div>
    <div id="labels"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
